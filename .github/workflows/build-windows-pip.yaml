name: Build Windows pip

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        default: '3.10'
        type: choice
        options:
          - '3.9'
          - '3.10'
          - '3.11'
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install project dependencies
        run: |
          pip install -e ".[dev]" || pip install -e .

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Check build artifacts
        run: |
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-pip-${{ matrix.python-version }}
          path: dist/
          retention-days: 30

      # 仅在 Python 3.10 时安装 NSIS
      - name: Install NSIS (for installer build)
        if: matrix.python-version == '3.10'
        run: |
          choco install nsis -y
        shell: powershell

      # 仅在 Python 3.10 时调用 NSIS 构建安装包
      - name: Build NSIS installer (Python 3.10)
        if: matrix.python-version == '3.10'
        run: |
          makensis /V4 "building/buildCompleteInstaller.nsi"
        shell: powershell

      # 上传 NSIS 安装包（假设 nsi 生成的 exe 在当前工作目录或特定目录下）
      - name: Upload NSIS installer artifact
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: psychopy-installer-win-py310
          path: |
            **/*.exe
          retention-days: 30
