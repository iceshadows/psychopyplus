name: Build Windows pip

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        default: '3.10'
        type: choice
        options:
          - '3.10'
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # 让 pip cache 依赖 pyproject
          cache-dependency-path: |
            pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      # 按照相对仓库根路径安装本地 whl
      - name: Install wearlab_protocolX wheel
        run: |
          pip install thirdParty/wearlab_protocolX-0.3.2a0-cp310-cp310-win_amd64.whl

      - name: Install project dependencies
        run: |
          pip install -e ".[dev]" || pip install -e .

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Check build artifacts
        run: |
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-pip-${{ matrix.python-version }}
          path: dist/
          retention-days: 30

      - name: Install NSIS (for installer build)
        if: matrix.python-version == '3.10'
        shell: powershell
        run: |
          choco install nsis -y

      - name: Build NSIS installer (Python 3.10)
        if: matrix.python-version == '3.10'
        shell: powershell
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\Bin\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          )
          
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          
          if (-not $makensis) {
            Write-Error "makensis.exe not found. Checked: $($candidates -join ', ')"
            exit 1
          }
          
          Write-Host "Using makensis at: $makensis"
          & $makensis /V4 "building/buildCompleteInstaller.nsi"

      # 上传 NSIS 安装包（假设 nsi 生成的 exe 在当前工作目录或特定目录下）
      - name: Upload NSIS installer artifact
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: psychopy-installer-win-py310
          path: |
            **/*.exe
          retention-days: 30
