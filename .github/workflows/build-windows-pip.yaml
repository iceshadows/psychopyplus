name: Build Windows pip

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        default: '3.10'
        type: choice
        options:
          - '3.10'
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # 让 pip cache 依赖 pyproject
          cache-dependency-path: |
            pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      # 按照相对仓库根路径安装本地 whl
      - name: Install wearlab_protocolX wheel
        run: |
          pip install thirdParty/wearlab_protocolX-0.3.2a0-cp310-cp310-win_amd64.whl

      - name: Install project dependencies
        run: |
          pip install -e ".[dev]" || pip install -e .

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Check build artifacts
        run: |
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-pip-${{ matrix.python-version }}
          path: dist/
          retention-days: 30

      - name: Detect Python path (for NSIS)
        if: matrix.python-version == '3.10'
        shell: powershell
        run: |
          $pyExe = python -c "import sys; print(sys.executable)"
          $pyDir = Split-Path $pyExe -Parent
          echo "PYPATH=$pyDir" >> $env:GITHUB_ENV
      - name: Install NSIS
        run: |
          choco install nsis -y
      # 2) 调用 joncloud/makensis-action 构建安装包
      - name: Build NSIS installer (Python 3.10)
        if: matrix.python-version == '3.10'
        uses: joncloud/makensis-action@v5.0
        env:
          # 从上一步写入的 PYPATH
          PYPATH: ${{ env.PYPATH }}
          # 你可以按需要改这三个变量值
          PRODUCT_NAME: PsychoPyPlus
          PRODUCT_VERSION: ${{ github.ref_name }}   # 如 v1.2.3，可改成你自己的版本来源
          ARCH: x64                                 # 或 ${{ runner.arch }} / ${{ env.PROCESSOR_ARCHITECTURE }}
        with:
          # 你的 NSIS 脚本
          script-file: building/buildCompleteInstaller.nsi
          # 传给 makensis 的参数，使用 /D 定义 NSIS 变量
          arguments: >
            /V4
            /DPYPATH="${{ env.PYPATH }}"
            /DPRODUCT_NAME="${{ env.PRODUCT_NAME }}"
            /DPRODUCT_VERSION="${{ env.PRODUCT_VERSION }}"
            /DARCH="${{ env.ARCH }}"
          # 插件目录：假设 nsis-plugins 目录在仓库根目录
          additional-plugin-paths: |
            nsis-plugins
      - name: Upload NSIS installer artifact
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: psychopy-installer-win-py310
          # 按你的 .nsi 脚本实际输出路径调整
          path: |
            **/*.exe
          retention-days: 30
