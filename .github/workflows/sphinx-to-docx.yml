name: Sphinx to Docx (Full Extensions)

on:
  workflow_dispatch:
    inputs:
      chapter_name:
        description: '要编译的章节文件名 (相对于 source 目录，不带后缀)'
        required: true
        default: 'index'
        type: string
      source_dir:
        description: 'Sphinx source 目录路径'
        required: true
        default: 'docs'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装系统级依赖 (Pandoc 和 Inkscape)
      # Inkscape 是 sphinxcontrib.inkscapeconverter 必需的
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc inkscape

      # 4. 安装 Python 扩展包
      # 对应你 conf.py 中的 extensions 列表
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # === 核心依赖 ===
          pip install sphinx sphinx_rtd_theme
          
          # === 扩展对应的 PyPI 包 ===
          # sphinx.ext.* 是内置的，不需要安装
          # sphinx_design
          pip install sphinx-design
          # sphinx_copybutton
          pip install sphinx-copybutton
          # myst_parser
          pip install myst-parser
          # sphinxcontrib.inkscapeconverter
          pip install sphinxcontrib-svg2pdfconverter
          
          # === 关于 redirect ===
          # 如果 'redirect' 是第三方包 (sphinx-reredirects)，请取消下面注释:
          # pip install sphinx-reredirects
          # 如果 'redirect' 是你本地写在 _ext 里的 py 文件，则不需要 pip install
          
          # === 加载项目自身的 requirements.txt (防止遗漏) ===
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f ${{ inputs.source_dir }}/requirements.txt ]; then pip install -r ${{ inputs.source_dir }}/requirements.txt; fi

      # 5. 编译 HTML (SingleHTML)
      # -D master_doc=... 强制指定编译入口，实现“只编译子章节”
      - name: Build SingleHTML
        run: |
          echo "Building chapter: ${{ inputs.chapter_name }}"
          sphinx-build -b singlehtml \
            -D master_doc="${{ inputs.chapter_name }}" \
            ${{ inputs.source_dir }} \
            build_output

      # 6. HTML 转 Docx (Pandoc)
      - name: Convert to Docx
        run: |
          cd build_output
          # 检查是否有自定义样式文件，否则用默认
          REFERENCE_DOC=""
          if [ -f "../reference.docx" ]; then
            REFERENCE_DOC="--reference-doc=../reference.docx"
            echo "Using custom reference doc."
          fi
          
          pandoc index.html -o ../${{ inputs.chapter_name }}.docx $REFERENCE_DOC

      # 7. 上传 Docx 文件
      - name: Upload Docx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docx-${{ inputs.chapter_name }}
          path: ${{ inputs.chapter_name }}.docx
          if-no-files-found: error

      # 8. 上传 HTML 文件夹 (包含图片和样式)
      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ inputs.chapter_name }}
          path: build_output/
