name: Sphinx to Docx (Specific Chapter)

on:
  workflow_dispatch:
    inputs:
      chapter_name:
        description: '要编译的章节文件名 (相对于 source 目录，不带后缀)'
        required: true
        default: 'index'
        type: string
      source_dir:
        description: 'Sphinx source 目录路径'
        required: true
        default: 'docs'

jobs:
  build_docx:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装 Pandoc (系统级依赖)
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # 4. 安装 Python 依赖 (修复了 sphinx_design 报错)
      - name: Install Sphinx dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. 安装报错中缺失的库
          pip install sphinx-design
          
          # 2. 尝试安装项目自带的 requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f ${{ inputs.source_dir }}/requirements.txt ]; then pip install -r ${{ inputs.source_dir }}/requirements.txt; fi
          
          # 3. 兜底安装：确保 sphinx 和常用主题存在
          pip install sphinx sphinx_rtd_theme

      # 5. 编译 HTML
      # 使用 singlehtml 模式，并通过 -D master_doc 修改入口
      - name: Build SingleHTML with Sphinx
        run: |
          echo "Building chapter: ${{ inputs.chapter_name }}"
          sphinx-build -b singlehtml \
            -D master_doc="${{ inputs.chapter_name }}" \
            ${{ inputs.source_dir }} \
            build_output

      # 6. 使用 Pandoc 将 HTML 转为 Docx
      - name: Convert HTML to Docx
        run: |
          cd build_output
          # singlehtml 的输出文件固定为 index.html
          # 转换时引用上一级目录可能的 reference.docx
          pandoc index.html -o ../${{ inputs.chapter_name }}.docx \
            --reference-doc=../reference.docx || echo "No custom reference doc found, using default."

      # 7. 上传 Docx 文件
      - name: Upload Docx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docx-${{ inputs.chapter_name }}
          path: ${{ inputs.chapter_name }}.docx
          if-no-files-found: error

      # 8. 上传 HTML 文件夹 (新增需求)
      # 上传整个 build_output 目录，确保图片和 CSS 样式都包含在内
      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ inputs.chapter_name }}
          path: build_output/
