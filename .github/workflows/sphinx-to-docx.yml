name: Sphinx to Docx (Fixed Imports)

on:
  workflow_dispatch:
    inputs:
      chapter_name:
        description: '要编译的章节文件名 (相对于 source 目录，不带后缀)'
        required: true
        default: 'api'  # 你刚才测试的是 api
        type: string
      source_dir:
        description: 'Sphinx source 目录路径'
        required: true
        default: 'docs/source'

jobs:
  build-doc:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装系统依赖 (Pandoc & Inkscape)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc inkscape

      # 4. 安装 Sphinx 及相关扩展
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 核心与主题
          pip install sphinx sphinx_rtd_theme
          
          # 扩展列表中的包
          pip install sphinx-design sphinx-copybutton myst-parser sphinxcontrib-svg2pdfconverter
          
          # 如果你的项目里有 requirements.txt，尝试安装
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f ${{ inputs.source_dir }}/requirements.txt ]; then pip install -r ${{ inputs.source_dir }}/requirements.txt; fi

      # =========================================================
      # 5. [关键步骤] 动态修改 conf.py 以跳过 import 错误
      # =========================================================
      - name: Patch conf.py to Mock Imports
        run: |
          CONF_PATH="${{ inputs.source_dir }}/conf.py"
          
          echo "" >> $CONF_PATH
          echo "# ================= CI AUTO PATCH =================" >> $CONF_PATH
          echo "# 告诉 autodoc 不要真去 import 这些复杂的科学计算库" >> $CONF_PATH
          echo "autodoc_mock_imports = [" >> $CONF_PATH
          echo "    'psychopy', 'numpy', 'scipy', 'pandas', 'matplotlib', " >> $CONF_PATH
          echo "    'wx', 'pyglet', 'pygame', 'PIL', 'openpyxl', " >> $CONF_PATH
          echo "    'soundfile', 'serial', 'json_tricks', 'questplus'" >> $CONF_PATH
          echo "]" >> $CONF_PATH
          
          echo "Patched conf.py content (tail):"
          tail -n 10 $CONF_PATH

      # 6. 编译 HTML (SingleHTML)
      - name: Build SingleHTML
        run: |
          echo "Building chapter: ${{ inputs.chapter_name }}"
          sphinx-build -b singlehtml \
            -D master_doc="${{ inputs.chapter_name }}" \
            ${{ inputs.source_dir }} \
            build_output

      # 7. HTML 转 Docx
      - name: Convert to Docx
        run: |
          cd build_output
          REFERENCE_DOC=""
          if [ -f "../reference.docx" ]; then
            REFERENCE_DOC="--reference-doc=../reference.docx"
          fi
          
          # 忽略上一级可能的引用错误
          pandoc index.html -o ../${{ inputs.chapter_name }}.docx $REFERENCE_DOC || echo "Conversion warning ignored"

      # 8. 上传 Docx
      - name: Upload Docx Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docx-${{ inputs.chapter_name }}
          path: ${{ inputs.chapter_name }}.docx
          if-no-files-found: error

      # 9. 上传 HTML 文件夹
      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ inputs.chapter_name }}
          path: build_output/
